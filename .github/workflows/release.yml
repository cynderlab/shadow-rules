name: Generate and Release Rules

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Rules
        run: python main.py

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TAG_NAME="v$(date +'%Y.%m.%d-%H%M%S')"
          shopt -s nullglob
          files=(rules/*.rules)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No rules/*.rules generated" >&2
            exit 1
          fi

          notes='Automated release of Suricata shadow-it rules.

          Included files:
          - Individual category files
          - `all_shadow_rules.rules` (combined)'

          # CLI instead of action-gh-release (Node 20 / Unicorn HTML on 500s).
          publish() {
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              gh release upload "$TAG_NAME" "${files[@]}" --clobber
            else
              gh release create "$TAG_NAME" "${files[@]}" \
                --title "Shadow Rules $TAG_NAME" \
                --notes "$notes" \
                --target "${GITHUB_SHA}"
            fi
          }

          for attempt in 1 2 3 4 5; do
            if publish; then
              echo "Published $TAG_NAME"
              exit 0
            fi
            echo "Release attempt ${attempt} failed; retrying..."
            sleep $((attempt * 8))
          done
          echo "Failed to publish $TAG_NAME after retries" >&2
          exit 1

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, subprocess, sys

          proc = subprocess.run(
              ["gh", "release", "list", "--limit", "100", "--json", "tagName"],
              check=True, capture_output=True, text=True,
          )
          tags = [item["tagName"] for item in json.loads(proc.stdout)]
          old = tags[10:]
          if not old:
              print(f"Nothing to prune ({len(tags)} releases).")
              sys.exit(0)
          for tag in old:
              print(f"Deleting old release and tag: {tag}")
              subprocess.run(
                  ["gh", "release", "delete", tag, "--yes", "--cleanup-tag"],
                  check=True,
              )
          PY
